<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UltOd Client Three.js 2.5D Template</title>
    <style>
      html, body { margin: 0; padding: 0; overflow: hidden; background: #181824; touch-action: none;
        font-family: Georgia, "Times New Roman", serif; }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
        clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
      #app-canvas { display: block; width: 100%; height: 100%; }

      /* HUD top-left: position + network */
      #hud { position: fixed; top: 12px; left: 12px; color: #cfcfcf; font-family: monospace; font-size: 12px;
        background: rgba(10,10,18,.6); padding: 6px 10px; border-radius: 6px; pointer-events: none; white-space: pre-line; }

      /* Quest tracker (top-right) */
      #quest-panel { position: fixed; top: 12px; right: 12px; width: 240px; background: rgba(24,20,12,.92);
        border: 1px solid #8a6a43; border-radius: 8px; padding: 10px 14px; color: #e8d9b5; font-size: 14px; }
      #quest-title { font-weight: bold; color: #ffd700; margin-bottom: 4px; font-size: 15px; }
      #quest-gold { margin-top: 6px; color: #ffd700; font-size: 13px; }

      /* Dialog box (bottom center) */
      #dialog-box { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); width: min(520px, 90vw);
        background: rgba(24,20,12,.95); border: 2px solid #8a6a43; border-radius: 10px; padding: 14px 18px;
        color: #e8d9b5; font-size: 15px; display: none; }
      #dialog-name { color: #ffd700; font-weight: bold; margin-bottom: 6px; }
      #dialog-text { line-height: 1.45; }
      #dialog-actions { margin-top: 10px; display: flex; gap: 10px; justify-content: flex-end; }
      .dialog-btn { background: #3a3020; color: #ffd700; border: 1px solid #8a6a43; border-radius: 6px;
        min-height: 44px; box-sizing: border-box; padding: 6px 16px; cursor: pointer; font-family: inherit; font-size: 14px; }
      .dialog-btn:hover { background: #55462e; }

      /* Inventory strip (bottom-left) */
      #inventory { position: fixed; bottom: 12px; left: 12px; display: flex; gap: 6px; }
      .inv-slot { width: 44px; height: 44px; background: rgba(24,20,12,.9); border: 1px solid #555;
        border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
      .inv-slot.filled { border-color: #ffd700; }

      /* Joystick (mobile) */
      #joystick-zone { position: fixed; bottom: 80px; right: 24px; width: 120px; height: 120px; border-radius: 50%;
        border: 2px solid rgba(255,255,255,.35); background: rgba(255,255,255,.08); display: none; align-items: center; justify-content: center; }
      #joystick-knob { width: 48px; height: 48px; border-radius: 50%; background: rgba(255,122,0,.75); transform: translate(0,0); }
      #interact-btn { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
        background: rgba(58,48,32,.9); color: #ffd700; border: 1px solid #8a6a43; border-radius: 10px;
        padding: 12px 28px; font-family: inherit; font-size: 16px; display: none; }

      /* Local preview atlas */
      .map-selector { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 20;
        color: #eadab8; }
      .map-selector__toggle { display: block; min-height: 44px; box-sizing: border-box; margin: 0 auto; padding: 7px 18px 6px; border: 1px solid #8a6a43;
        border-radius: 999px; background: rgba(24,20,12,.88); color: #e9c97e; font: 700 12px/1 Georgia, serif;
        letter-spacing: .13em; text-transform: uppercase; cursor: pointer; box-shadow: 0 4px 18px rgba(0,0,0,.28); }
      .map-selector__toggle:hover, .map-selector__toggle:focus-visible { background: #3a3020; border-color: #c9a55e;
        outline: none; box-shadow: 0 0 0 2px rgba(201,165,94,.22), 0 5px 22px rgba(0,0,0,.35); }
      .map-selector.is-open .map-selector__toggle { border-radius: 999px 999px 7px 7px; }
      .map-selector__panel { position: absolute; top: 50px; left: 50%; width: min(340px, calc(100vw - 28px));
        transform: translateX(-50%); box-sizing: border-box; padding: 16px; border: 1px solid #8a6a43;
        border-radius: 10px; background:
          linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px),
          linear-gradient(145deg, rgba(50,42,27,.98), rgba(17,15,12,.98));
        background-size: 18px 18px, 18px 18px, auto; box-shadow: 0 18px 48px rgba(0,0,0,.55); }
      .map-selector__panel[hidden] { display: none; }
      .map-selector__eyebrow { display: block; color: #a98c58; font: 700 10px/1.2 Georgia, serif;
        letter-spacing: .17em; text-transform: uppercase; }
      .map-selector__heading { display: block; margin: 4px 0 13px; color: #f0dfb8; font-size: 19px; font-weight: 400; }
      .map-selector__list { display: grid; gap: 7px; }
      .map-selector__entry { position: relative; display: flex; min-height: 44px; box-sizing: border-box; align-items: center; justify-content: space-between;
        gap: 16px; padding: 10px 12px; border: 1px solid rgba(138,106,67,.55); border-radius: 6px;
        color: #dfcfac; text-decoration: none; background: rgba(9,8,6,.35); transition: border-color .15s, background .15s, transform .15s; }
      .map-selector__entry:hover, .map-selector__entry:focus-visible { border-color: #c9a55e; background: rgba(90,70,38,.38);
        outline: none; transform: translateX(2px); }
      .map-selector__entry.is-active { padding-left: 19px; border-color: #d0ad65; background: rgba(111,84,40,.36); }
      .map-selector__entry.is-active::before { content: ''; position: absolute; left: 8px; top: 50%; width: 4px; height: 4px;
        border-radius: 50%; background: #ffd77e; box-shadow: 0 0 8px #ffd77e; transform: translateY(-50%); }
      .map-selector__label { font-size: 14px; }
      .map-selector__kind { color: #a98c6d; font: 700 9px/1 monospace; letter-spacing: .1em; text-transform: uppercase; }

      @media (max-width: 620px) {
        #hud { max-width: calc(100vw - 136px); box-sizing: border-box; overflow: hidden; }
        #quest-panel { top: 68px; left: 12px; right: 12px; width: auto; box-sizing: border-box; }
        #dialog-box { left: 12px; right: 12px; width: auto; max-height: calc(100vh - 110px);
          transform: none; box-sizing: border-box; overflow-y: auto; }
        .map-selector { left: auto; right: 12px; transform: none; }
        .map-selector__panel { left: auto; right: 0; width: min(340px, calc(100vw - 24px)); transform: none; }
      }

      @media (max-width: 620px) and (max-height: 420px) {
        #dialog-box { bottom: 12px; max-height: calc(100vh - 24px); }
        #joystick-zone { bottom: 12px; }
        #interact-btn { bottom: 12px; }
      }
    </style>
  </head>
  <body>
    <canvas id="app-canvas" role="img" aria-label="Playable isometric world" aria-describedby="canvas-description">
      Interactive isometric world preview.
    </canvas>
    <p id="canvas-description" class="sr-only">Explore the world with keyboard, pointer, or touch controls.</p>
    <div id="hud" aria-hidden="true"></div>
    <div id="network-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

    <div id="quest-panel" role="status" aria-label="Quest status" aria-live="polite" aria-atomic="true">
      <div id="quest-title">Rescue the Princess</div>
      <div id="quest-objective">Talk to the King to start.</div>
      <div id="quest-gold">Gold: 25</div>
    </div>

    <div id="dialog-box" role="dialog" aria-modal="true" aria-labelledby="dialog-name" aria-describedby="dialog-text">
      <div id="dialog-name"></div>
      <div id="dialog-text"></div>
      <div id="dialog-actions"></div>
    </div>

    <div id="inventory" role="status" aria-label="Inventory status" aria-live="polite" aria-atomic="true">
      <div class="inv-slot" id="inv-sword" role="img" aria-label="Sword: empty" title="Sword"></div>
      <div class="inv-slot" id="inv-key" role="img" aria-label="Cell key: empty" title="Cell Key"></div>
    </div>

    <button id="interact-btn">Interagir</button>

    <div id="joystick-zone"><div id="joystick-knob"></div></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
