name: Validate Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Audit Node dependencies
        run: npm run check:audit
      - name: Verify package archives in an isolated consumer
        run: npm run check:packages
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate public/private content boundary
        run: node scripts/check-public-boundary.mjs
      - name: Typecheck content SDK
        run: npm run check:content-sdk
      - name: Build content SDK
        run: npm --workspace @ultod/content-sdk run build
      - name: Typecheck client core
        run: npm run check:client-core
      - name: Build client core
        run: npm --workspace @ultod/threejs-client-core run build
      - name: Test content SDK
        run: >-
          npx playwright test
          tests/content-sdk-types.spec.ts
          tests/content-sdk-entity-validation.spec.ts
          tests/content-sdk-graph-validation.spec.ts
          tests/content-sdk-normalization.spec.ts
          tests/content-pack-types.spec.ts
          tests/content-pack-validation.spec.ts
          tests/content-pack-normalization.spec.ts
          tests/content-pack-integrity.spec.ts
          tests/content-pack-publication.spec.ts
          tests/content-sdk-adapter-common.spec.ts
          tests/content-sdk-storycore-adapter.spec.ts
          tests/content-sdk-legacy-adapter.spec.ts
          tests/content-sdk-adapter-hardening.spec.ts
          tests/client-core-exports.spec.ts
          tests/client-core-input-camera.spec.ts
          tests/client-core-presentation.spec.ts
          tests/client-core-net-ui-content.spec.ts
          tests/tutorial-world-entities.spec.ts
          tests/tutorial-world-pack.spec.ts
          tests/tutorial-world-mounting.spec.ts
      - name: Validate Markdown and internal links
        shell: bash
        run: |
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          tracked_paths = subprocess.run(
              ["git", "ls-files", "-z", "--", "*.md"],
              check=True,
              stdout=subprocess.PIPE,
          ).stdout.split(b"\0")
          md_files = [Path(path.decode("utf-8")) for path in tracked_paths if path]
          if not md_files:
              raise SystemExit("No tracked Markdown files found")

          errors = []
          for md_path in md_files:
              text = md_path.read_text(encoding="utf-8")
              # Extract inline markdown links: [label](target)
              for target in re.findall(r'\[[^\]]*\]\(([^\)]+)\)', text):
                  if target.startswith(("http://", "https://", "#", "mailto:")):
                      continue
                  clean_target = target.split("#")[0].strip("<>")
                  resolved = (md_path.parent / clean_target).resolve()
                  if not resolved.exists():
                      errors.append(f"{md_path}: broken link target '{target}'")

          if errors:
              for err in errors:
                  print(f"Error: {err}")
              raise SystemExit(1)

          print(f"Successfully validated {len(md_files)} markdown files and all internal links.")
          PY
